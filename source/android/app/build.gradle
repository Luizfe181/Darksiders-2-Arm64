plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vigil.darksiders2'
    // 34 e a plataforma estavel de referencia; o SDK local pode ter outra.
    compileSdk 34
    // A instalacao automatica do 34.0.0 falhou nesta maquina (ficou sem aapt);
    // 36.0.0 esta completo e o AGP aceita-o.
    buildToolsVersion '36.0.0'
    // NDK instalado fora do SDK (build_apk.ps1 aponta ndk.dir para ele).
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.vigil.darksiders2"
        minSdk 26        // Vulkan 1.1 garantido; alvo do CMake e android-26
        targetSdk 31     // 31: storage classico e sem restricoes de exported
        versionCode 1
        versionName "1.0.0-alpha"

        ndk {
            // O runtime so existe para arm64 (NDK r27c, aarch64-linux-android26).
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // SDL2_DIR vem por -PSDL2_DIR=... (build_apk.ps1); sem ele o
                // CMake tenta third_party/SDL2 e falha com mensagem propria.
                def sdl2 = project.findProperty('SDL2_DIR') ?: ''
                def recompDir = project.findProperty('D2_RECOMP_DIR') ?: ''
                def dxvkNativeDir = project.findProperty('D2_DXVK_NATIVE_DIR') ?: ''
                def cmakeArgs = ["-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-26"]
                if (sdl2) {
                    cmakeArgs += "-DSDL2_DIR=${sdl2}".toString()
                }
                if (recompDir) {
                    cmakeArgs += "-DD2_RECOMP_DIR=${recompDir}".toString()
                }
                if (dxvkNativeDir) {
                    cmakeArgs += "-DD2_DXVK_NATIVE_DIR=${dxvkNativeDir}".toString()
                }
                arguments(*cmakeArgs)
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            // O "boot test" usa o debug: sem minify, para o logcat mostrar tudo.
            minifyEnabled false
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            // Sem `version`: usa o CMake do SDK/AGP em vez de exigir um exacto.
            path file('../CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            // SDL2 e o runtime carregam libc++_shared.so directamente do APK.
            useLegacyPackaging = true
        }
    }
}

// Sem dependencias: a Activity herda de org.libsdl.app.SDLActivity, cujos
// fontes estao copiados em src/main/java (SDL2 2.30.9, licenca zlib).
