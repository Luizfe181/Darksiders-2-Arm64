[binaries]
c = 'C:/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android26-clang.cmd'
cpp = 'C:/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android26-clang++.cmd'
ar = 'C:/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe'
strip = 'C:/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-strip.exe'
# Host tools DXVK's build needs (glslangValidator compiles its shaders).
# glslangValidator must be on PATH or given here as an absolute path.

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
# b_lundef off: Android allows undefined symbols in shared libraries to be
# resolved by the loader, which is how libvulkan.so is bound.
cpp_args = ['-D__ANDROID__']
c_args = ['-D__ANDROID__']
